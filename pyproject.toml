[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vsrx-hybrid"
version = "1.0.0"
description = "Resource-efficient hybrid hard-subtitle removal for batch video processing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "VSR-X Contributors"}]
dependencies = [
  "av>=14.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "scenedetect-headless>=0.6.6",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psutil>=5.9",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.9,<4", "onnxruntime>=1.20,<2"]
ocr-gpu = ["rapidocr>=3.9,<4", "onnxruntime-gpu>=1.21,<1.27"]
openvino = ["rapidocr>=3.9", "openvino>=2025.0"]
test = ["pytest>=8.2", "pytest-cov>=5.0", "httpx>=0.27"]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8.2", "pytest-cov>=5.0", "httpx>=0.27", "build>=1.2"]

[project.scripts]
vsrx = "vsrx.app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vsrx"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[tool.ruff.lint.per-file-ignores]
"src/vsrx/app/cli.py" = ["B006", "B008"]
